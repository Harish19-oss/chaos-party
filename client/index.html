        <style>

            /* =====================================
               GLOBAL
               ===================================== */

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                min-height: 100%;
                font-family:
                    Arial,
                    Helvetica,
                    sans-serif;
                background: #080b14;
                color: white;
            }

            button,
            input {
                font: inherit;
            }

            button {
                cursor: pointer;
            }

            /* =====================================
               SCREENS
               ===================================== */

            .screen {
                width: 100%;
                min-height: 100vh;
            }

            .hidden {
                display: none !important;
            }

            /* =====================================
               HOME
               ===================================== */

            #home {
                min-height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;

                padding: 25px;

                background:
                    radial-gradient(
                        circle at top,
                        #304d9b 0%,
                        #121a31 42%,
                        #05070d 100%
                    );
            }

            .home-card {
                width: min(520px, 100%);

                padding: 40px 32px;

                border-radius: 28px;

                text-align: center;

                background:
                    rgba(15, 23, 42, 0.9);

                border:
                    1px solid
                    rgba(255, 255, 255, 0.15);

                box-shadow:
                    0 30px 100px
                    rgba(0, 0, 0, 0.55);

                backdrop-filter:
                    blur(15px);
            }

            .logo {
                margin: 0;

                font-size: clamp(
                    42px,
                    9vw,
                    68px
                );

                font-weight: 1000;

                letter-spacing: 3px;

                text-shadow:
                    0 0 25px
                    rgba(255, 255, 255, 0.25);
            }

            .tagline {
                margin: 10px 0 30px;

                color:
                    rgba(255, 255, 255, 0.7);

                font-size: 16px;
            }

            .input-group {
                margin-bottom: 15px;
            }

            .input-group input {
                width: 100%;

                padding: 15px 17px;

                border-radius: 13px;

                border:
                    1px solid
                    rgba(255, 255, 255, 0.15);

                outline: none;

                background:
                    rgba(255, 255, 255, 0.07);

                color: white;

                font-size: 16px;

                transition:
                    border-color 0.2s,
                    background 0.2s;
            }

            .input-group input::placeholder {
                color:
                    rgba(255, 255, 255, 0.45);
            }

            .input-group input:focus {
                border-color:
                    rgba(100, 150, 255, 0.8);

                background:
                    rgba(255, 255, 255, 0.1);
            }

            .secondary-button {

                border-radius: 13px;

                font-weight: 800;

                font-size: 15px;

                transition:
                    transform 0.2s,
                    filter 0.2s;
            }

            .primary-button {
                color: white;

                background:
                    linear-gradient(
                        135deg,
                        #4f7cff,
                        #7654ff
                    );
            }

            .secondary-button {
                color: white;

                background:
                    rgba(255, 255, 255, 0.08);

                border:
                    1px solid
                    rgba(255, 255, 255, 0.12);
            }

            .primary-button:hover,
            .secondary-button:hover {
                transform:
                    translateY(-2px);

                filter:
                    brightness(1.12);
            }

            .primary-button:active,
            .secondary-button:active {
                transform:
                    scale(0.98);
            }

            .divider {
                display: flex;

                align-items: center;

                gap: 12px;

                margin: 20px 0;

                color:
                    rgba(255, 255, 255, 0.35);

                font-size: 12px;
            }

            .divider::after {

                height: 1px;

            .lobby-player-name {

                background: #ffb703;

                color: #111;

                font-size: 10px;

                flex-direction: column;

                gap: 10px;
            }

            #lobbyMessage {
                min-height: 20px;

                text-align: center;

                color:

                font-size: 13px;
            }

            /* =====================================
               COUNTDOWN
               ===================================== */

            #countdown {
                position: fixed;

                inset: 0;

                z-index: 2000;

                display: flex;

                justify-content: center;

                align-items: center;

                        #182d5a,

                font-size: 25px;

                font-weight: 800;

                letter-spacing: 3px;

                color:
                    rgba(255, 255, 255, 0.75);

            #countdownNumber {
                font-size:

                        100px,
                        25vw,
                        220px

                font-weight: 1000;

                line-height: 1;

                color: white;

                text-shadow:
                    0 0 40px

                animation:
                    countdownPop

            }

            @keyframes countdownPop {

                0% {
                    transform: scale(1.5);

                    opacity: 0;
                }

                40% {
                    transform: scale(1);

                    opacity: 1;
                }

                100% {
                    transform: scale(0.9);

                    opacity: 0.9;
                }

               GAME SCREEN
               ===================================== */

            #game {
                min-height: 100vh;
            }

            /* =====================================
               ROUND DISPLAY
               ===================================== */

            .game-title-area {
                display: flex;

                flex-direction: column;

                align-items: flex-start;

                gap: 4px;
            }

            .round-display {
                display: inline-block;

                padding: 4px 10px;

                border-radius: 7px;

                background:
                    rgba(255, 255, 255, 0.08);

                border:
                    1px solid

                color:
                    rgba(255, 255, 255, 0.7);

                font-size: 11px;

                font-weight: 800;

                letter-spacing: 1.5px;
            }

            /* =====================================
               MOBILE
               ===================================== */

            @media (max-width: 600px) {

                    border-radius: 22px;

                #lobby {
                    padding: 15px;
                }

                .lobby-header h1 {
                    font-size: 30px;
                }

                .lobby-card {
                    padding: 18px;
                }

                .room-input {
                    flex-direction: column;
                }

                .room-input button {
                    width: 100%;
                }

                #displayRoomCode {
                    font-size: 24px;
                }

            }

        </style>


    <style id="chaosTruePageNavigation">
    /* =========================================================
       CHAOS PARTY — TRUE SCREEN NAVIGATION
       HOME → LOBBY → COUNTDOWN → GAME
       Only one major screen is visible at a time.
       ========================================================= */

    html,
    body{
        width:100%;
        min-height:100%;
        margin:0;
        overflow:hidden !important;
    }

    body{
        position:relative;
    }

    /* Every major screen occupies the exact same viewport. */
    body > .screen,
    body > section.screen,
    .screen{
        position:fixed !important;
        inset:0 !important;
        width:100% !important;
        min-width:100% !important;
        height:100% !important;
        min-height:100% !important;
        max-height:none !important;
        margin:0 !important;
        overflow:auto !important;
        overscroll-behavior:contain !important;
        box-sizing:border-box !important;
    }

    /* Hidden really means GONE — it cannot remain underneath another page. */
    .screen.hidden{
        display:none !important;
        visibility:hidden !important;
        pointer-events:none !important;
    }

    /* Visible screen is the only interactive layer. */
    .screen:not(.hidden){
        display:block !important;
        visibility:visible !important;
        pointer-events:auto !important;
        z-index:10;
    }

    /* Home gets a centered viewport rather than document-flow positioning. */
    #home.screen:not(.hidden){
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
    }

    /* Lobby gets its own independent viewport. */
    #lobby.screen:not(.hidden){
        display:block !important;
        padding:28px 18px 40px !important;
        box-sizing:border-box !important;
    }

    /* Countdown and game become independent pages too. */
    #countdown.screen:not(.hidden),
    #game.screen:not(.hidden){
        display:block !important;
    }

    /* Prevent a previous page's scroll position from visually carrying over. */
    body.page-lobby #home,
    body.page-countdown #home,
    body.page-game #home{
        display:none !important;
    }

    /* Safety: if any browser/plugin tries to restore old page layout,
       only the active screen can paint. */
    .screen.hidden *,
    .screen.hidden::before,
    .screen.hidden::after{
        visibility:hidden !important;
    }
    </style>

    #countdown,#game{
        overflow:hidden !important;
    }

    /* Preserve existing game CSS and birthday CSS underneath this layer. */

    /* -------- SMALL SCREEN -------- */
    @media(max-width:700px){
        #home.screen:not(.hidden){
            padding:16px 12px !important;
        }
        .home-card{
            padding:44px 22px 30px !important;
            border-radius:25px !important;
        }
        .logo{
            font-size:clamp(42px,13vw,58px) !important;
            letter-spacing:4px !important;
        }
        .logo::before{
            font-size:7px;
            letter-spacing:2.5px;
        }
        .room-input{
            grid-template-columns:1fr !important;
        }
        #lobby.screen:not(.hidden){
            padding:16px 12px 30px !important;
        }
    }

    @media(prefers-reduced-motion:reduce){
        .home-card,.primary-button,#joinRoom{
            transition:none !important;
        }
        #home::before,.home-card::after,#lobby::before{
            animation:none !important;
        }
    }

    @keyframes cpLuxuryBreath{
        0%,100%{opacity:.55;transform:translate(-50%,-52%) scale(.94)}
        50%{opacity:1;transform:translate(-50%,-52%) scale(1.07)}
    }
    @keyframes cpScan{
        0%{transform:translateY(-80px)}
        100%{transform:translateY(720px)}
    }
    @keyframes cpGrid{
        from{transform:translate3d(0,0,0)}
        to{transform:translate3d(80px,80px,0)}
    }
    </style>

    </head>


    <body>

        <!-- =====================================
             HOME SCREEN
             ===================================== -->

        <section
            id="home"
            class="screen"
        >

            <div class="home-card">

                <h1 class="logo">
                    CHAOS PARTY 🎮
                </h1>

                <p class="tagline">
                    Pass the bomb. Survive the chaos. 💣
                </p>


                <!-- PLAYER NAME -->

                <div class="input-group">

                    <input
                        id="playerName"
                        type="text"
                        maxlength="16"
                        placeholder="Enter your name"
                        autocomplete="off"
                    >

                </div>


                <!-- CREATE ROOM -->

                <button
                    id="createRoom"
                    class="primary-button"
                >
                    🎮 CREATE ROOM
                </button>


                <div class="divider">
                    OR
                </div>


                <!-- JOIN ROOM -->

                <div class="room-input">

                    <input
                        id="roomCode"
                        type="text"
                        maxlength="5"
                        placeholder="ROOM CODE"
                        autocomplete="off"
                    >

                    <button
                        id="joinRoom"
                        class="secondary-button"
                    >
                        JOIN
                    </button>

                </div>


                <div id="status"></div>

            </div>

        </section>


        <!-- =====================================
             LOBBY SCREEN
             ===================================== -->

        <section
            id="lobby"
            class="screen hidden"
        >

            <div class="lobby-container">

                <div class="lobby-header">

                    <h1>
                        🎮 PARTY LOBBY
                    </h1>

                    <div class="room-code-box">

                        <span class="room-code-label">
                            Room Code
                        </span>

                        <span id="displayRoomCode">
                            -----
                        </span>

                    </div>

                </div>


                <div class="lobby-card">

                    <div class="players-heading">

                        <h2>
                            Players
                        </h2>

                        <span id="playerCount">
                            0 / 8
                        </span>

                    </div>


                    <div id="playersList"></div>


                    <div class="lobby-actions">

                        <button
                            id="readyButton"
                            class="primary-button"
                        >
                            ✅ READY
                        </button>


                        <button
                            id="startGame"
                            class="secondary-button"
                        >
                            🚀 START GAME
                        </button>


                        <div id="lobbyMessage"></div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================
             COUNTDOWN SCREEN
             ===================================== -->

        <section
            id="countdown"
            class="screen hidden"
        >

            <div class="countdown-content">

                <div class="countdown-title">
                    GET READY!
                </div>

                <div id="countdownNumber">
                    3
                </div>

            </div>

        </section>


        <!-- =====================================
             GAME SCREEN
             ===================================== -->

        <section
            id="game"
            class="screen hidden"
        >

            <div class="game-wrapper">

                <div class="game-header">

                    <!-- GAME TITLE + ROUND -->

                    <div class="game-title-area">

                        <h1 class="game-title">
                            💣 CHAOS PARTY
                        </h1>

                        <div
                            id="roundDisplay"
                            class="round-display"
                        >
                            ROUND 1
                        </div>

                    </div>


                    <!-- GAME TIMER -->

                    <div
                        id="gameTimer"
                        class="game-timer"
                    >
                        30
                    </div>

                </div>


                <!-- GAME ARENA -->

                <div
                    id="arena"
                    class="arena"
                ></div>


                <!-- CONTROLS -->

                <div class="controls-info">

                    🎮 Move with
                    <strong>W A S D</strong>
                    or
                    <strong>Arrow Keys</strong>
                    &nbsp; • &nbsp;
                    💣 Get close to another player to pass the bomb!

                </div>


                <!-- UNIVERSAL MOVEMENT D-PAD -->

<div
    class="mobile-controls"
    id="universalMovementControls"
    aria-label="Movement controls"
>

    <div class="mobile-controls-label">
        MOVE
    </div>

    <div class="mobile-dpad">

        <button
            class="mobile-touch-button"
            data-direction="up"
            type="button"
            aria-label="Move up"
        >▲</button>

        <button
            class="mobile-touch-button"
            data-direction="left"
            type="button"
            aria-label="Move left"
        >◀</button>

        <div class="mobile-touch-center">✦</div>

        <button
            class="mobile-touch-button"
            data-direction="right"
            type="button"
            aria-label="Move right"
        >▶</button>

        <button
            class="mobile-touch-button"
            data-direction="down"
            type="button"
            aria-label="Move down"
        >▼</button>

    </div>

</div>
            </div>

        </section>


        <!-- =====================================
             SOCKET.IO
             ===================================== -->

        <script src="/socket.io/socket.io.js"></script>


        <script>

            // =================================
            // SOCKET CONNECTION
            // =================================

            var socket = io();


            // =================================
            // DOM
            // =================================

            const home =
                document.getElementById(
                    "home"
                );

            const lobby =
                document.getElementById(
                    "lobby"
                );

            const countdown =
                document.getElementById(
                    "countdown"
                );

            const game =
                document.getElementById(
                    "game"
                );

            const playerName =
                document.getElementById(
                    "playerName"
                );

            const roomCodeInput =
                document.getElementById(
                    "roomCode"
                );

            const createRoomButton =
                document.getElementById(
                    "createRoom"
                );

            const joinRoomButton =
                document.getElementById(
                    "joinRoom"
                );

            const readyButton =
                document.getElementById(
                    "readyButton"
                );

            const startGameButton =
                document.getElementById(
                    "startGame"
                );

            const status =
                document.getElementById(
                    "status"
                );

            const displayRoomCode =
                document.getElementById(
                    "displayRoomCode"
                );

            const playersList =
                document.getElementById(
                    "playersList"
                );

            const playerCount =
                document.getElementById(
                    "playerCount"
                );

            const lobbyMessage =
                document.getElementById(
                    "lobbyMessage"
                );

            const countdownNumber =
                document.getElementById(
                    "countdownNumber"
                );


            // =================================
            // ROUND DISPLAY
            // =================================

            const roundDisplay =
                document.getElementById(
                    "roundDisplay"
                );


            // =================================
            // LOCAL STATE
            // =================================

            let currentRoomCode = null;

            let isHost = false;

            let countdownInterval = null;


            // =================================
            // SCREEN SWITCH
            // =================================

            function showScreen(
                screen
            ) {

                // =================================
                // TRUE FULL-SCREEN ROUTER
                // =================================

                const screens = [
                    home,
                    lobby,
                    countdown,
                    game
                ];

                screens.forEach(
                    page => {

                        page.classList.add(
                            "hidden"
                        );

                        page.setAttribute(
                            "aria-hidden",
                            "true"
                        );

                        page.style.display =
                            "none";
                    }
                );

                if (!screen) {
                    return;
                }

                screen.classList.remove(
                    "hidden"
                );

                screen.setAttribute(
                    "aria-hidden",
                    "false"
                );

                screen.style.display =
                    "block";

                // Home needs flex centering.
                if (screen === home) {
                    screen.style.display =
                        "flex";
                }

                // Make the browser treat this as a
                // screen transition, not page scrolling.
                if (screen === lobby) {
                    document.body.classList
                        .remove(
                            "page-home",
                            "page-countdown",
                            "page-game"
                        );

                    document.body.classList
                        .add(
                            "page-lobby"
                        );
                } else if (
                    screen === countdown
                ) {
                    document.body.classList
                        .remove(
                            "page-home",
                            "page-lobby",
                            "page-game"
                        );

                    document.body.classList
                        .add(
                            "page-countdown"
                        );
                } else if (
                    screen === game
                ) {
                    document.body.classList
                        .remove(
                            "page-home",
                            "page-lobby",
                            "page-countdown"
                        );

                    document.body.classList
                        .add(
                            "page-game"
                        );
                } else {
                    document.body.classList
                        .remove(
                            "page-lobby",
                            "page-countdown",
                            "page-game"
                        );

                    document.body.classList
                        .add(
                            "page-home"
                        );
                }

                // Always return the new screen to its top.
                screen.scrollTop = 0;
            }



            // =================================
            // INITIAL SCREEN
            // =================================

            showScreen(
                home
            );

            // =================================
            // CREATE ROOM
            // =================================

            createRoomButton.addEventListener(
                "click",
                () => {

                    const name =
                        playerName.value.trim();

                    if (!name) {

                        status.textContent =
                            "Please enter your name.";

                        playerName.focus();

                        return;
                    }

                    status.textContent =
                        "Creating room...";

                    socket.emit(
                        "createRoom",
                        {
                            name
                        }
                    );
                }
            );


            // =================================
            // JOIN ROOM
            // =================================

            joinRoomButton.addEventListener(
                "click",
                () => {

                    const name =
                        playerName.value.trim();

                    const code =
                        roomCodeInput.value
                            .trim()
                            .toUpperCase();

                    if (!name) {

                        status.textContent =
                            "Please enter your name.";

                        playerName.focus();

                        return;
                    }

                    if (
                        code.length !== 5
                    ) {

                        status.textContent =
                            "Enter a valid 5-character room code.";

                        roomCodeInput.focus();

                        return;
                    }

                    status.textContent =
                        "Joining room...";

                    socket.emit(
                        "joinRoom",
                        {
                            name,
                            roomCode: code
                        }
                    );
                }
            );


            // =================================
            // ENTER KEY
            // =================================

            playerName.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        createRoomButton.click();
                    }

                }
            );


            roomCodeInput.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        joinRoomButton.click();
                    }

                }
            );


            // =================================
            // ROOM CREATED
            // =================================

            socket.on(
                "roomCreated",
                data => {

                    if (!data) {
                        return;
                    }

                    currentRoomCode =
                        data.roomCode;

                    isHost = true;

                    showLobby(
                        data.roomCode
                    );

                    updatePlayers(
                        data.players || []
                    );
                }
            );


            // =================================
            // ROOM UPDATED
            // =================================

            socket.on(
                "roomUpdated",
                data => {

                    if (!data) {
                        return;
                    }

                    currentRoomCode =
                        data.roomCode;

                    updatePlayers(
                        data.players || []
                    );

                    showLobby(
                        data.roomCode
                    );
                }
            );


            // =================================
            // SHOW LOBBY
            // =================================

            function showLobby(
                code
            ) {

                showScreen(
                    lobby
                );

                displayRoomCode.textContent =
                    code;

                status.textContent = "";

                updateLobbyControls();
            }


            // =================================
            // UPDATE PLAYERS
            // =================================

            function updatePlayers(
                players
            ) {

                playersList.innerHTML = "";

                playerCount.textContent =
                    `${players.length} / 8`;

                players.forEach(
                    player => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.className =
                            "lobby-player";


                        const name =
                            document.createElement(
                                "span"
                            );

                        name.className =
                            "lobby-player-name";

                        name.textContent =
                            player.name;


                        if (
                            player.isHost
                        ) {

                            const badge =
                                document.createElement(
                                    "span"
                                );

                            badge.className =
                                "host-badge";

                            badge.textContent =
                                "HOST";

                            name.appendChild(
                                badge
                            );
                        }


                        const ready =
                            document.createElement(
                                "span"
                            );

                        ready.className =
                            "ready-badge";


                        if (
                            player.isHost
                        ) {

                            ready.classList.add(
                                "ready"
                            );

                            ready.textContent =
                                "HOST";

                        } else if (
                            player.ready
                        ) {

                            ready.classList.add(
                                "ready"
                            );

                            ready.textContent =
                                "READY ✓";

                        } else {

                            ready.classList.add(
                                "not-ready"
                            );

                            ready.textContent =
                                "NOT READY";
                        }


                        row.appendChild(
                            name
                        );

                        row.appendChild(
                            ready
                        );

                        playersList.appendChild(
                            row
                        );

                    }
                );


                updateLobbyControls();
            }


            // =================================
            // LOBBY CONTROLS
            // =================================

            function updateLobbyControls() {

                if (isHost) {

                    readyButton.classList.add(
                        "hidden"
                    );

                    startGameButton.classList.remove(
                        "hidden"
                    );

                    lobbyMessage.textContent =
                        "You are the host. Start when everyone is ready.";

                } else {

                    readyButton.classList.remove(
                        "hidden"
                    );

                    startGameButton.classList.add(
                        "hidden"
                    );

                    lobbyMessage.textContent =
                        "Click READY when you're ready!";
                }
            }


            // =================================
            // READY BUTTON
            // =================================

            readyButton.addEventListener(
                "click",
                () => {

                    socket.emit(
                        "toggleReady"
                    );

                    if (
                        readyButton.textContent
                            .includes("READY")
                    ) {

                        readyButton.textContent =
                            "⏳ TOGGLE READY";

                    }

                }
            );


            // =================================
            // START GAME
            // =================================

            startGameButton.addEventListener(
                "click",
                () => {

                    lobbyMessage.textContent =
                        "Starting game...";

                    socket.emit(
                        "startGame"
                    );
                }
            );


            // =================================
            // GAME STARTING
            // =================================

            socket.on(
                "gameStarting",
                () => {

                    // Reset round display
                    if (roundDisplay) {

                        roundDisplay.textContent =
                            "ROUND 1";
                    }

                    startCountdown();
                }
            );


            // =================================
            // COUNTDOWN
            // =================================

            function startCountdown() {

                showScreen(
                    countdown
                );

                let number = 3;

                countdownNumber.textContent =
                    number;

                restartCountdownAnimation();


                clearInterval(
                    countdownInterval
                );


                countdownInterval =
                    setInterval(
                        () => {

                            number--;

                            if (
                                number > 0
                            ) {

                                countdownNumber.textContent =
                                    number;

                                restartCountdownAnimation();

                            } else {

                                clearInterval(
                                    countdownInterval
                                );

                                countdownNumber.textContent =
                                    "💣";

                                restartCountdownAnimation();


                                setTimeout(
                                    () => {

                                        showScreen(
                                            game
                                        );

                                    },
                                    700
                                );
                            }

                        },
                        1000
                    );
            }


            // =================================
            // COUNTDOWN ANIMATION RESTART
            // =================================

            function restartCountdownAnimation() {

                countdownNumber.style.animation =
                    "none";

                void countdownNumber.offsetWidth;

                countdownNumber.style.animation =
                    "countdownPop 0.9s ease-out";
            }


            // =================================
            // ROOM ERROR
            // =================================

            socket.on(
                "roomError",
                data => {

                    const message =
                        data &&
                        data.message
                            ? data.message
                            : "Something went wrong.";

                    status.textContent =
                        message;

                    lobbyMessage.textContent =
                        message;

                    console.warn(
                        "Room error:",
                        message
                    );
                }
            );


            // =================================
            // SOCKET CONNECTION
            // =================================

            socket.on(
                "connect",
                () => {

                    console.log(
                        "🟢 Connected to server:",
                        socket.id
                    );
                }
            );


            socket.on(
                "disconnect",
                () => {

                    console.log(
                        "🔴 Disconnected from server"
                    );
                }
            );

        </script>


        <!-- =====================================
             GAME CLIENT
             ===================================== -->

        <script src="/js/game.js"></script>


    <script id="chaosUnifiedRouteGuard">
    (() => {
        const boot = () => {
            const ids = ["home","lobby","countdown","game"];
            const pages = ids.map(id => document.getElementById(id)).filter(Boolean);
            if (!pages.length) return;

            const sync = () => {
                const active = pages.find(page => !page.classList.contains("hidden"));
                if (!active) return;

                pages.forEach(page => {
                    const isActive = page === active;
                    page.setAttribute("aria-hidden", String(!isActive));
                    page.style.pointerEvents = isActive ? "auto" : "none";
                    page.style.visibility = isActive ? "visible" : "hidden";
                    if (!isActive) page.style.display = "none";
                });

                active.style.display =
                    active.id === "home" ? "flex" : "block";

                active.scrollTop = 0;

                document.body.classList.remove(
                    "page-home","page-lobby","page-countdown","page-game"
                );
                document.body.classList.add("page-" + active.id);
            };

            // Existing showScreen remains responsible for game logic.
            // This observer only enforces the visual one-screen rule.
            pages.forEach(page => {
                new MutationObserver(sync).observe(page, {
                    attributes:true,
                    attributeFilter:["class","style"]
                });
            });

            sync();
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded",boot,{once:true});
        } else {
            boot();
        }
    })();
    </script>
